<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calendrier Grist cliquable</title>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
    }

    /* =========================
       TITRE DU MOIS
       ========================= */

    #titre-mois {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      padding: 8px 0 12px 0;
    }

    /* =========================
       EN-TÊTES
       ========================= */

    #entetes {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 6px;
      font-weight: bold;
      text-align: center;
    }

    #entetes div {
      padding: 8px 4px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
    }

    /* WEEK-END */

    #entetes div:nth-child(6),
    #entetes div:nth-child(7) {
      background: #d9eaff;
      border-color: #b8d4f5;
    }

    /* =========================
       GRILLE
       ========================= */

    #contenu {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    /* =========================
       CASE JOUR
       ========================= */

    .jour {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 8px;
      min-height: 70px;
      cursor: pointer;
      background: white;
    }

    .jour:hover {
      background: #f2f2f2;
    }

    /* =========================
       WEEK-END
       ========================= */

    .jour.weekend {
      background: #e5f1ff;
      border-color: #c4daf2;
    }

    .jour.weekend:hover {
      background: #d7e9fc;
    }

    /* =========================
       HORS MOIS
       ========================= */

    .jour.hors-mois {
      background: #eeeeee;
      color: #888888;
    }

    .jour.hors-mois:hover {
      background: #e2e2e2;
    }

    .jour.hors-mois.weekend {
      background: #edf4fc;
      color: #999999;
      border-color: #d8e3ef;
    }

    .jour.hors-mois.weekend:hover {
      background: #e3edf8;
    }

    /* =========================
       JOUR SÉLECTIONNÉ
       ========================= */

    .jour.selectionne {
      outline: 3px solid #2b6cb0;
      outline-offset: -3px;
      font-weight: bold;
    }

    /* =========================
       INFORMATIONS
       ========================= */

  .numero-jour {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 6px;
}
    .info {
      font-size: 13px;
      line-height: 1.4;
    }

  </style>
</head>

<body>

  <!-- TITRE DU MOIS -->
  <div id="titre-mois"></div>

  <!-- EN-TÊTES -->
  <div id="entetes">
    <div>LUNDI</div>
    <div>MARDI</div>
    <div>MERCREDI</div>
    <div>JEUDI</div>
    <div>VENDREDI</div>
    <div>SAMEDI</div>
    <div>DIMANCHE</div>
  </div>

  <!-- CALENDRIER -->
  <div id="contenu"></div>

  <script>

    grist.ready({
      requiredAccess: "full"
    });

    grist.onRecords(async function(records) {
   const tableSelection = await grist.docApi.fetchTable("DATE_SELECTIONNEE");

let dateSelectionnee = null;

if (
  tableSelection.Date_consultee &&
  tableSelection.Date_consultee[0]
) {
  dateSelectionnee =
    new Date(tableSelection.Date_consultee[0] * 1000);
}

      const contenu = document.getElementById("contenu");
      const titreMois = document.getElementById("titre-mois");

      contenu.innerHTML = "";
      titreMois.innerHTML = "";

      /* =========================
         FILTRAGE DU MOIS
         ========================= */

      const recordsMois = records.filter(
        record => record.Afficher_mois_selectionne
      );

      /* =========================
         TITRE DU MOIS
         ========================= */

      if (recordsMois.length > 0) {

        const premierRecord = recordsMois[0];

        const numeroMois =
          Number(premierRecord.Numero_mois_affiche);

        const annee =
          premierRecord.Annee;

        const nomsMois = [
          "",
          "JANVIER",
          "FÉVRIER",
          "MARS",
          "AVRIL",
          "MAI",
          "JUIN",
          "JUILLET",
          "AOÛT",
          "SEPTEMBRE",
          "OCTOBRE",
          "NOVEMBRE",
          "DÉCEMBRE"
        ];

        const nomMois =
          nomsMois[numeroMois] || "";

        titreMois.textContent =
          nomMois + " " + annee;
      }

      /* =========================
         CONSTRUCTION DU CALENDRIER
         ========================= */

      recordsMois.forEach(record => {

        const jours = [

          ["Lundi", record.Lundi, record.Affichage_Lundi],
          ["Mardi", record.Mardi, record.Affichage_Mardi],
          ["Mercredi", record.Mercredi, record.Affichage_Mercredi],
          ["Jeudi", record.Jeudi, record.Affichage_Jeudi],
          ["Vendredi", record.Vendredi, record.Affichage_Vendredi],
          ["Samedi", record.Samedi, record.Affichage_Samedi],
          ["Dimanche", record.Dimanche, record.Affichage_Dimanche]

        ];

        jours.forEach(([nom, date, affichage], index) => {

          if (!date) {
            return;
          }

          /* =========================
             CRÉATION DE LA CASE
             ========================= */

          const caseJour =
            document.createElement("div");

          caseJour.className = "jour";

          /* =========================
             WEEK-END
             ========================= */

          if (index === 5 || index === 6) {
            caseJour.classList.add("weekend");
          }

          /* =========================
             DÉTECTION HORS MOIS
             ========================= */

          const dateJour =
            new Date(date);

          const moisAffiche =
            Number(record.Numero_mois_affiche);

          if (
            (dateJour.getMonth() + 1)
            !== moisAffiche
          ) {
            caseJour.classList.add("hors-mois");
          }
          if (dateSelectionnee) {
  const d1 = new Date(date);
  const d2 = new Date(dateSelectionnee);

  if (
    d1.getFullYear() === d2.getFullYear() &&
    d1.getMonth() === d2.getMonth() &&
    d1.getDate() === d2.getDate()
  ) {
    caseJour.classList.add("selectionne");
  }
}

          /* =========================
             CONTENU
             ========================= */

       let affichagePropre = affichage || "";

affichagePropre = affichagePropre.replace(
  /^\s*\d+\s*/,
  ""
);
          affichagePropre = affichagePropre.replace(
  /(🟠)/g,
  "<br>$1"
);

caseJour.innerHTML =
  '<div class="numero-jour">' +
  dateJour.getDate() +
  '</div>' +
  '<div class="info">' +
  affichagePropre +
  '</div>';

          /* =========================
             CLIC SUR LA JOURNÉE
             ========================= */

          caseJour.addEventListener(
            "click",
            async function() {

              /* Retirer l'ancienne sélection */

              document
                .querySelectorAll(".jour")
                .forEach(j =>
                  j.classList.remove("selectionne")
                );

              /* Sélectionner la nouvelle journée */

              caseJour.classList.add("selectionne");

              /* Écrire la date dans Grist */

              const table =
                await grist.docApi.fetchTable(
                  "DATE_SELECTIONNEE"
                );

              const ligneId =
                table.id[0];

              await grist.docApi.applyUserActions([

                [
                  "UpdateRecord",
                  "DATE_SELECTIONNEE",
                  ligneId,
                  {
                    Date_consultee: date
                  }
                ]

              ]);

            }
          );

          contenu.appendChild(caseJour);

        });

      });

    });

  </script>

</body>
</html>
