<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendrier Grist cliquable</title>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
    }

    #entetes {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 6px;
      font-weight: bold;
      text-align: center;
    }

    #entetes div {
      padding: 8px 4px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    #contenu {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .jour {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 8px;
      min-height: 70px;
      cursor: pointer;
      background: white;
    }

    .jour:hover {
      background: #f2f2f2;
    }

    .info {
      font-size: 13px;
      line-height: 1.4;
    }
  </style>
</head>

<body>

<div id="entetes">
  <div>LUNDI</div>
  <div>MARDI</div>
  <div>MERCREDI</div>
  <div>JEUDI</div>
  <div>VENDREDI</div>
  <div>SAMEDI</div>
  <div>DIMANCHE</div>
</div>

<div id="contenu"></div>

<script>
  grist.ready({
    requiredAccess: "full"
  });

  grist.onRecords(function(records) {

    const contenu = document.getElementById("contenu");
    contenu.innerHTML = "";

    records
      .filter(record => record.Afficher_mois_selectionne)
      .forEach(record => {

        const jours = [
          ["Lundi", record.Lundi, record.Affichage_Lundi],
          ["Mardi", record.Mardi, record.Affichage_Mardi],
          ["Mercredi", record.Mercredi, record.Affichage_Mercredi],
          ["Jeudi", record.Jeudi, record.Affichage_Jeudi],
          ["Vendredi", record.Vendredi, record.Affichage_Vendredi],
          ["Samedi", record.Samedi, record.Affichage_Samedi],
          ["Dimanche", record.Dimanche, record.Affichage_Dimanche]
        ];

        jours.forEach(([nom, date, affichage]) => {

          if (!date) {
            return;
          }

          const caseJour = document.createElement("div");
          caseJour.className = "jour";

          caseJour.innerHTML =
            '<div class="info">' + (affichage || "") + '</div>';

          caseJour.addEventListener("click", async function() {
            const table = await grist.docApi.fetchTable("DATE_SELECTIONNEE");
            const ligneId = table.id[0];

            await grist.docApi.applyUserActions([
              ["UpdateRecord", "DATE_SELECTIONNEE", ligneId, {
                Date_consultee: date
              }]
            ]);
          });

          contenu.appendChild(caseJour);
        });
      });

  });
</script>

</body>
</html>
