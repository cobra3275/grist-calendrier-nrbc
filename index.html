<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendrier Grist cliquable</title>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
    }

    #contenu {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .jour {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 8px;
      min-height: 70px;
      cursor: pointer;
      background: white;
    }

    .jour:hover {
      background: #f2f2f2;
    }

    .numero {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .info {
      font-size: 13px;
      line-height: 1.4;
    }
  </style>
</head>

<body>

<div id="contenu"></div>

<script>
  grist.ready({
    requiredAccess: "full"
  });

  grist.onRecords(function(records) {

    const contenu = document.getElementById("contenu");
    contenu.innerHTML = "";

    records
  .filter(record => record.Afficher_mois_selectionne)
  .forEach(record => {

     const jours = [
  ["Lundi", record.Lundi, record.Affichage_Lundi],
  ["Mardi", record.Mardi, record.Affichage_Mardi],
  ["Mercredi", record.Mercredi, record.Affichage_Mercredi],
  ["Jeudi", record.Jeudi, record.Affichage_Jeudi],
  ["Vendredi", record.Vendredi, record.Affichage_Vendredi],
  ["Samedi", record.Samedi, record.Affichage_Samedi],
  ["Dimanche", record.Dimanche, record.Affichage_Dimanche]
];

      jours.forEach(([nom, date, affichage]) => {

        if (!date) {
          return;
        }

        const caseJour = document.createElement("div");
        caseJour.className = "jour";

        caseJour.innerHTML =
          '<div class="numero">' + nom + '</div>' +
          '<div class="info">' + (affichage || "") + '</div>';

        caseJour.addEventListener("click", async function() {
  const table = await grist.docApi.fetchTable("DATE_SELECTIONNEE");
  const ligneId = table.id[0];

  await grist.docApi.applyUserActions([
    ["UpdateRecord", "DATE_SELECTIONNEE", ligneId, {
      Date_consultee: date
    }]
  ]);
});

        contenu.appendChild(caseJour);
      });
    });

  });
</script>

</body>
</html>
